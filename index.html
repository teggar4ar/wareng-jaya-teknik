<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applies the stored theme before first paint so prerendered pages don't flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.classList.add(t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!--
      Only the two faces used above the fold are preloaded: Oswald 700 (the h1)
      and Inter 400 (body copy). The rest load via @font-face on demand.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/oswald-latin-700-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-400-normal.woff2" crossorigin />

    <!--
      Google tag (gtag.js). Loaded after the page is interactive: gtag.js is
      ~141 KB and blocked the main thread for ~280 ms when loaded eagerly, which
      hurt TBT without making the pageview any more accurate. dataLayer is
      seeded first so anything queued before the script lands still gets sent.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1P9ZH63K0M');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-1P9ZH63K0M';
          document.head.appendChild(s);
        }
        function schedule() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadGtag, { timeout: 4000 });
          } else {
            setTimeout(loadGtag, 2000);
          }
        }
        if (document.readyState === 'complete') {
          schedule();
        } else {
          window.addEventListener('load', schedule, { once: true });
        }
      })();
    </script>

    <!--
      Title, description, canonical, robots and social tags are injected per
      route by src/components/SEO.jsx and baked into each prerendered page.
      Do not duplicate them here — that produces two of each tag in the output.
    -->
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
