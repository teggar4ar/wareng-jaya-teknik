<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applies the stored theme before first paint so prerendered pages don't flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.classList.add(t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1P9ZH63K0M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-1P9ZH63K0M');
    </script>

    <!--
      Title, description, canonical, robots and social tags are injected per
      route by src/components/SEO.jsx and baked into each prerendered page.
      Do not duplicate them here — that produces two of each tag in the output.
    -->
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
